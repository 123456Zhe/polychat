name: Build Signed Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g., 1.1.0)'
        required: true
        default: '1.1.0'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Signing uses the committed android-app/polychat.keystore (same key for
      # debug and release), so any build can overwrite-install a previous one.
      # versionCode stays fixed and only ever increases manually — never derive
      # it from the clock (a lower value blocks overwrite installs).

      - name: Update version name
        working-directory: android-app
        run: |
          sed -i "s/versionName = .*/versionName = \"${{ inputs.version }}\"/" app/build.gradle.kts

      - name: Build Signed APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          files: android-app/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
