name: Build Signed Release APK
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version name
        required: true
        default: 1.1.0
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Configure release signing
        working-directory: android-app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" -a -n "$STORE_PASSWORD" -a -n "$KEY_ALIAS" -a -n "$KEY_PASSWORD"
          echo "$KEYSTORE_B64" | base64 --decode > polychat-release.keystore
          printf 'storeFile=polychat-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - name: Update version name
        working-directory: android-app
        run: sed -i "s/versionName = .*/versionName = \"${{ inputs.version }}\"/" app/build.gradle.kts
      - name: Build Signed APK
        working-directory: android-app
        run: ./gradlew assembleRelease
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          files: android-app/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
